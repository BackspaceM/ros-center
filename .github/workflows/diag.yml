name: Diagnose Docker Hub
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe registry auth
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          for u in BackspaceM backspacem backspace lys; do
            code=$(curl -s -o /tmp/authr -w "%{http_code}" -u "$u:$TOKEN" "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/busybox:pull" || true)
            echo "AUTH $u -> $code $(head -c 100 /tmp/authr)"
          done
