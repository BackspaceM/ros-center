name: Diagnose Docker Hub
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect secret integrity and auth variants
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set +e
          echo "TOKEN_LEN=${#TOKEN}"
          echo "TOKEN_SHA=$(printf '%s' "$TOKEN" | sha256sum | cut -c1-16)"
          echo "TOKEN_PREFIX=$(printf '%s' "$TOKEN" | cut -c1-9)"
          echo "TOKEN_SUFFIX=$(printf '%s' "$TOKEN" | rev | cut -c1-4 | rev)"
          B64=$(printf 'BackspaceM:%s' "$TOKEN" | base64 -w0)
          echo "=== basic curl auth ==="
          curl -sS -w "\nHTTP:%{http_code}\n" -H "Authorization: Basic $B64" "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/busybox:pull" | head -c 250
          echo
          echo "=== docker login lowercase ==="
          printf '%s' "$TOKEN" | docker login -u backspacem --password-stdin 2>&1 | tail -3
          echo "=== hub api basic ==="
          curl -sS -w "\nHTTP:%{http_code}\n" -u "BackspaceM:$TOKEN" https://hub.docker.com/v2/user/ | head -c 250
          echo
