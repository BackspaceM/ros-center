name: Release desktop installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true
        default: "v1.0.0"
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tauri-macos:
    name: Tauri GUI (macOS arm64 + x64)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - uses: actions/cache@v4
        with:
          path: dist/base
          key: node-runtime-22.22.2-${{ runner.os }}-${{ runner.arch }}
      - run: cargo install tauri-cli --version '^2' --locked
      - run: node build/tauri-assets.js --arch=arm64
      - run: cargo tauri build --target aarch64-apple-darwin
        working-directory: src-tauri
      - run: node build/tauri-assets.js --arch=x64
      - run: cargo tauri build --target x86_64-apple-darwin
        working-directory: src-tauri
      - name: Collect Tauri macOS bundles
        run: |
          mkdir -p dist/tauri-out
          find src-tauri/target/aarch64-apple-darwin/release/bundle -type f \( -name '*.dmg' -o -name '*.app.tar.gz' \) -exec cp {} dist/tauri-out/ \; 2>/dev/null || true
          find src-tauri/target/x86_64-apple-darwin/release/bundle -type f \( -name '*.dmg' -o -name '*.app.tar.gz' \) -exec cp {} dist/tauri-out/ \; 2>/dev/null || true
          for f in dist/tauri-out/*; do [ -e "$f" ] && shasum -a 256 "$f" > "$f.sha256"; done || true
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-macos
          if-no-files-found: warn
          path: dist/tauri-out/*

  tauri-windows:
    name: Tauri GUI (Windows x64, WebView2 bootstrap)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - uses: actions/cache@v4
        with:
          path: dist/base
          key: node-runtime-22.22.2-${{ runner.os }}-${{ runner.arch }}
      - run: cargo install tauri-cli --version '^2' --locked
      - run: node build/tauri-assets.js --arch=win
      - run: cargo tauri build --target x86_64-pc-windows-msvc
        working-directory: src-tauri
      - name: Collect Tauri Windows bundles
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/tauri-out | Out-Null
          Get-ChildItem -Path src-tauri/target/x86_64-pc-windows-msvc/release/bundle -Recurse -File -Include *.msi,*.exe | Copy-Item -Destination dist/tauri-out
          Get-ChildItem dist/tauri-out/* | ForEach-Object { $h=(Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(); "$h  $($_.Name)" | Set-Content "$($_.FullName).sha256" }
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-windows
          if-no-files-found: warn
          path: dist/tauri-out/*

  portable:
    name: Portable ZIP (macOS / Windows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: dist/base
          key: node-runtime-22.22.2-${{ runner.os }}-${{ runner.arch }}
      - run: node build/desktop.js --mac-x64
      - name: Build in-app update bundle (source only)
        run: node build/app-bundle.js
        env:
          ROS_RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: portable
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.zip.sha256

  macos:
    name: macOS .pkg + .dmg (arm64 + x64)
    # Intel macOS runner is available on all plans; pkgbuild/hdiutil just archive
    # files, so both arm64 and x64 payloads can be produced on the same host.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: dist/base
          key: node-runtime-22.22.2-${{ runner.os }}-${{ runner.arch }}
      - run: node build/macos-installer.js --arch=all
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          if-no-files-found: error
          path: |
            dist/*.pkg
            dist/*.pkg.sha256
            dist/*.dmg
            dist/*.dmg.sha256

  windows:
    name: Windows .exe installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ensure NSIS is available
        shell: pwsh
        run: |
          $paths = @("C:\Program Files (x86)\NSIS\makensis.exe", "C:\Program Files\NSIS\makensis.exe")
          if (-not ($paths | Where-Object { Test-Path $_ })) {
            choco install nsis -y --no-progress
          }
          & "C:\Program Files (x86)\NSIS\makensis.exe" /VERSION
      - uses: actions/cache@v4
        with:
          path: dist/base
          key: node-runtime-22.22.2-${{ runner.os }}-${{ runner.arch }}
      - run: node build/windows-installer.js
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.exe.sha256

  release:
    name: Publish GitHub Release
    needs: [portable, macos, windows, tauri-macos, tauri-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Compose checksums and release notes
        run: |
          set -euo pipefail
          cat dist/*.sha256 > dist/SHA256SUMS.txt
          cat > /tmp/release-notes.md <<'EOF'
          ## ROS Center 桌面版

          ### 新版：Tauri 原生桌面界面（推荐）
          双击 App 直接打开**原生应用窗口**（内嵌 WebView），不再弹系统浏览器、Windows 不再有黑色 CMD 窗口。
          托盘常驻：关闭窗口默认最小化到托盘（后台继续运行），可在「系统管理 → 设备管理 → 桌面版设置」改为完全退出；
          托盘图标左键打开窗口、右键菜单退出。Windows 若缺少 WebView2 Runtime，安装器会自动引导安装。
          产物前缀 `tauri-`：macOS 为 `.dmg` / `.app.tar.gz`，Windows 为 `.msi` / `.exe`。
          资源里内置 Node.js 运行时与应用源码，首次启动同步到用户数据目录，后续应用内更新照常可用。

          ### 兼容版：启动器 + 系统浏览器
          开箱即用：内置 Node.js 运行时，目标机器无需安装 Node.js 或执行 `npm install`。
          启动后自动打开浏览器访问 `http://localhost:10086`（端口占用会自动顺延）。

          | 平台 | 安装包 | 绿色版 |
          | --- | --- | --- |
          | macOS Apple Silicon | `*-macos-arm64.pkg` / `.dmg` | `ros-center-macos-arm64.zip` |
          | macOS Intel | `*-macos-x64.pkg` / `.dmg` | `ros-center-macos-x64.zip` |
          | Windows x64 | `*-windows-x64-setup.exe`（NSIS 安装向导，带卸载） | `ros-center-windows-x64.zip` |

          请选择与芯片一致的 macOS 版本：Apple Silicon 用 `arm64`，Intel Mac 用 `x64`。

          **macOS**：双击 `.pkg` 按向导安装到 `/Applications`，或双击 `.dmg` 把 App 拖进 Applications。
          程序未签名，首次打开请右键 → 打开，或执行
          `xattr -dr com.apple.quarantine "/Applications/ROS Center.app"`。
          数据与配置在 `~/Library/Application Support/ROS Center/`。

          **Windows**：运行 `*-setup.exe`，可创建开始菜单/桌面快捷方式，并可通过「设置 → 应用」或安装目录里的
          `Uninstall.exe` 卸载。数据与配置在 `%LOCALAPPDATA%\ROS Center\`。
          未签名程序如出现 SmartScreen，点「更多信息 → 仍要运行」。

          **绿色版**：解压后双击 `Start.command` / `Start.bat`，删除文件夹即卸载。

          **应用内更新**：`ros-center-app-*.zip` 是仅含程序源码的轻量更新包（约 200KB），由
          「系统管理 → 检查更新 → 应用内自动更新」自动下载，无需手动处理。
          - 桌面版：装好本版（含 `launcher.js`）后，后续更新点一次按钮即可自动替换程序文件并重启，
            不再需要重新下载 pkg/dmg/exe；数据目录不动，启动失败会自动回滚。
          - Docker 版：在 compose 里额外映射 `/var/run/docker.sock` 后，可一键拉取新镜像并按原配置
            重建容器（映射 docker.sock 会赋予容器宿主机 Docker 控制权，请自行评估）。
          - 已安装 v1.0.0 的用户需手动安装一次本版，之后即可永久应用内更新。

          首次使用请在「系统管理 → 设备管理」添加 RouterOS 设备（API 端口 8728，建议只读账号）。
          `SHA256SUMS.txt` 为所有产物的校验和，`*.sha256` 为单文件校验和。
          EOF
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing assets."
          else
            gh release create "$TAG" --title "ROS Center $TAG" \
              --notes-file /tmp/release-notes.md --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" dist/* --clobber
          echo "--- release assets ---"
          gh release view "$TAG" --json tagName,url,assets \
            --jq '.tagName, .url, (.assets[].name)'
