name: Release desktop installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true
        default: "v1.0.0"
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tauri-macos:
    name: Tauri GUI (macOS arm64 + x64)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - uses: actions/cache@v4
        with:
          path: dist/base
          key: node-runtime-22.22.2-${{ runner.os }}-${{ runner.arch }}
      - run: cargo install tauri-cli --version '^2' --locked
      - run: node build/tauri-assets.js --arch=arm64
      - run: cargo tauri build --target aarch64-apple-darwin
        working-directory: src-tauri
      - run: node build/tauri-assets.js --arch=x64
      - run: cargo tauri build --target x86_64-apple-darwin
        working-directory: src-tauri
      - name: Collect Tauri macOS bundles
        run: |
          mkdir -p dist/tauri-out
          # 统一加 tauri- 前缀，与兼容版 (ROS-Center-*) 一眼区分；按架构命名避免同名覆盖
          find src-tauri/target/aarch64-apple-darwin/release/bundle -type f -name '*.dmg' \
            -exec sh -c 'for f; do cp "$f" "dist/tauri-out/tauri-macos-arm64-$(basename "$f")"; done' sh {} + 2>/dev/null || true
          find src-tauri/target/x86_64-apple-darwin/release/bundle -type f -name '*.dmg' \
            -exec sh -c 'for f; do cp "$f" "dist/tauri-out/tauri-macos-x64-$(basename "$f")"; done' sh {} + 2>/dev/null || true
          find src-tauri/target/aarch64-apple-darwin/release/bundle -type f -name '*.app.tar.gz' \
            -exec sh -c 'for f; do cp "$f" "dist/tauri-out/tauri-macos-arm64-$(basename "$f")"; done' sh {} + 2>/dev/null || true
          find src-tauri/target/x86_64-apple-darwin/release/bundle -type f -name '*.app.tar.gz' \
            -exec sh -c 'for f; do cp "$f" "dist/tauri-out/tauri-macos-x64-$(basename "$f")"; done' sh {} + 2>/dev/null || true
          for f in dist/tauri-out/*; do [ -e "$f" ] && shasum -a 256 "$f" > "$f.sha256"; done || true
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-macos
          if-no-files-found: warn
          path: dist/tauri-out/*

  tauri-windows:
    name: Tauri GUI (Windows x64, WebView2 bootstrap)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - uses: actions/cache@v4
        with:
          path: dist/base
          key: node-runtime-22.22.2-${{ runner.os }}-${{ runner.arch }}
      - run: cargo install tauri-cli --version '^2' --locked
      - run: node build/tauri-assets.js --arch=win
      - run: cargo tauri build --target x86_64-pc-windows-msvc
        working-directory: src-tauri
      - name: Collect Tauri Windows bundles
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/tauri-out | Out-Null
          # 统一加 tauri-windows-x64- 前缀，与兼容版 setup.exe 一眼区分
          Get-ChildItem -Path src-tauri/target/x86_64-pc-windows-msvc/release/bundle -Recurse -File -Include *.msi,*.exe | ForEach-Object {
            Copy-Item $_.FullName -Destination (Join-Path (Get-Location) "dist/tauri-out/tauri-windows-x64-$($_.Name)")
          }
          Get-ChildItem dist/tauri-out/* | ForEach-Object { $h=(Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(); "$h  $($_.Name)" | Set-Content "$($_.FullName).sha256" }
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-windows
          if-no-files-found: warn
          path: dist/tauri-out/*

  portable:
    name: In-app update bundle (source only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build in-app update bundle (source only)
        run: node build/app-bundle.js
        env:
          ROS_RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: portable
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.zip.sha256

  release:
    name: Publish GitHub Release
    needs: [portable, tauri-macos, tauri-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Compose checksums and release notes
        run: |
          set -euo pipefail
          cat dist/*.sha256 > dist/SHA256SUMS.txt
          cat > /tmp/release-notes.md <<'EOF'
          ## ROS Center 桌面版（原生 App，无浏览器 / 无 CMD 黑框）

          本页只提供 **Tauri 原生桌面应用**：双击即是独立 App 窗口（内嵌 WebView），
          **不会打开系统浏览器，Windows 也不会弹出黑色 CMD 窗口**；macOS / Windows 均有系统托盘，
          关闭窗口默认最小化到托盘继续运行，托盘右键可退出。内置 Node.js 运行时，无需另装环境。

          ### 请按平台下载

          | 平台 | 安装包 |
          | --- | --- |
          | macOS Apple Silicon（M 系列） | `tauri-macos-arm64-*.dmg` |
          | macOS Intel | `tauri-macos-x64-*.dmg` |
          | Windows x64 | `tauri-windows-x64-*.msi`（推荐）或 `tauri-windows-x64-*.exe` |

          Windows 若缺少 WebView2 Runtime，安装器会自动引导安装（安装器已内嵌 bootstrapper，离线亦可）。

          **macOS**：双击 `.dmg` 把 App 拖进 Applications。程序未签名，首次打开请右键 → 打开，或执行
          `xattr -dr com.apple.quarantine "/Applications/ROS Center.app"`。
          数据与配置在 `~/Library/Application Support/ROS Center/`，卸载 App 不会删除。

          **Windows**：运行 `.msi` 或 `.exe`，可创建开始菜单/桌面快捷方式并卸载。数据与配置在
          `%LOCALAPPDATA%\ROS Center\`。未签名程序如出现 SmartScreen，点「更多信息 → 仍要运行」。

          ### 应用内更新
          `ros-center-app-*.zip` 是仅含程序源码的轻量更新包（约 200KB），由
          「系统管理 → 检查更新 → 应用内自动更新」自动下载，无需手动处理；数据目录不动，失败自动回滚。
          Docker 版在 compose 里额外映射 `/var/run/docker.sock` 后可一键拉取新镜像重建容器
          （映射 docker.sock 会赋予容器宿主机 Docker 控制权，请自行评估）。

          首次使用请在「系统管理 → 设备管理」添加 RouterOS 设备（API 端口 8728，建议只读账号）。
          `SHA256SUMS.txt` 为所有产物的校验和，`*.sha256` 为单文件校验和。
          EOF
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing assets."
          else
            gh release create "$TAG" --title "ROS Center $TAG" \
              --notes-file /tmp/release-notes.md --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" dist/* --clobber
          echo "--- release assets ---"
          gh release view "$TAG" --json tagName,url,assets \
            --jq '.tagName, .url, (.assets[].name)'
