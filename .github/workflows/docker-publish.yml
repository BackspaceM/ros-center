name: Build and publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate publish settings
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_USERNAME:-}" ]; then
            echo "Set repository variable DOCKERHUB_USERNAME" >&2
            exit 1
          fi

      - name: Read version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/ros-center:latest
            ${{ vars.DOCKERHUB_USERNAME }}/ros-center:${{ steps.version.outputs.version }}

      - name: Update Docker Hub overview
        env:
          HUB_USER: ${{ vars.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/hub-meta.json
          import json, sys
          raw = open("README.md", encoding="utf-8").read()
          # Docker Hub full_description is limited to 25000 bytes; cap at a paragraph boundary
          # and point to GitHub for the uncut document instead of failing the whole publish.
          limit = 24900
          if len(raw.encode("utf-8")) > limit:
              head = raw.encode("utf-8")[:limit].decode("utf-8", errors="ignore")
              head = head.rsplit("\n\n", 1)[0]
              raw = head + "\n\n> Full documentation: https://github.com/BackspaceM/ros-center#readme\n"
              print("README capped at %d bytes for Docker Hub" % len(raw.encode("utf-8")), file=sys.stderr)
          print(json.dumps({
            "description": "RouterOS multi-router control center: live traffic, traffic stats, config, bilingual UI, 13 themes",
            "full_description": raw
          }))
          PY
          CODE=$(curl -sS -o /tmp/hub-login.json -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"$HUB_USER\",\"password\":\"$HUB_TOKEN\"}" \
            https://hub.docker.com/v2/users/login/)
          if [ "$CODE" != "200" ]; then
            echo "Docker Hub login failed: $CODE" >&2
            cat /tmp/hub-login.json >&2
            exit 1
          fi
          JWT=$(python3 -c 'import json; print(json.load(open("/tmp/hub-login.json"))["token"])')
          CODE=$(curl -sS -o /tmp/hub-overview-resp -w '%{http_code}' -X PATCH \
            -H "Authorization: JWT $JWT" -H 'Content-Type: application/json' \
            --data-binary @/tmp/hub-meta.json \
            "https://hub.docker.com/v2/repositories/$HUB_USER/ros-center/")
          echo "Hub overview PATCH -> HTTP $CODE"
          if [ "$CODE" != "200" ]; then cat /tmp/hub-overview-resp >&2; exit 1; fi
          curl -fsS -H "Authorization: JWT $JWT" "https://hub.docker.com/v2/repositories/$HUB_USER/ros-center/" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print("Hub description:", d.get("description")); print("Overview length:", len(d.get("full_description") or ""))'
