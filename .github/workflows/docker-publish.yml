name: Build and publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Docker Hub username
        id: hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "DOCKERHUB_TOKEN secret is missing" >&2
            exit 1
          fi
          RESPONSE=$(curl -fsSL -H "Authorization: Bearer $DOCKERHUB_TOKEN" https://hub.docker.com/v2/user/)
          USERNAME=$(printf '%s' "$RESPONSE" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("username") or d.get("full_name") or "")')
          if [ -z "$USERNAME" ]; then
            echo "Could not resolve Docker Hub username" >&2
            exit 1
          fi
          echo "username=$USERNAME" >> "$GITHUB_OUTPUT"
          echo "Resolved Docker Hub user: $USERNAME"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ steps.hub.outputs.username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.hub.outputs.username }}/ros-center:latest
            ${{ steps.hub.outputs.username }}/ros-center:${{ github.sha }}
