<div class="shell" id="shell">
  <div class="nav-backdrop" id="navBackdrop" aria-hidden="true"></div>
  <aside class="side" id="sidebar">
    <div class="brand">
      <div class="logo" id="sideLogo" aria-hidden="true"><img src="/logo.svg" alt=""></div>
      <div class="brand-txt"><b>ROS Center</b><small id="brandVer">v1.1.43</small></div>
      <button class="icon-btn side-collapse" id="collapseBtn" type="button" title="收起侧栏" aria-label="收起侧栏">
        <svg class="i"><use href="#i-panel"/></svg>
      </button>
    </div>

    <nav class="nav" id="sideNav"></nav>

    <div class="side-foot" id="sideFoot" title="切换设备 / Switch device">
      <div class="dev-ico"><svg class="i"><use href="#i-device"/></svg></div>
      <div class="side-foot-txt"><b id="sideDevName">主路由</b><small id="sideDevSub">RouterOS</small></div>
      <span class="dot" id="sideDot"></span>
    </div>
    <div class="side-meta"><span id="sideMetaUptime">已运行 —</span><span id="sideMetaVer">v1.1.43</span></div>

    <div class="side-hidden">
      <select id="deviceSelect" aria-label="Device"></select>
      <span class="device-dot" id="deviceDot"></span>
      <span id="sideMode" hidden></span><b id="sideStream" hidden></b>
      <button id="settingsShortcut" type="button" title="连接设置"></button>
      <button id="updateBadge" type="button" hidden title="发现新版本"></button>
      <button id="exportBtn" type="button" title="获取配置快照"></button>
      <button id="authLogoutBtn" type="button" title="退出登录" hidden></button>
      <button id="foldAllBtn" type="button"></button>
      <button id="langBtn" type="button"><span id="langLabel">EN</span></button>
      <select id="themeSelect" aria-label="Theme"></select>
      <div class="health" id="health">
        <span class="h-donut" id="cpuBar"><b id="cpuVal">--</b></span>
        <span class="h-donut" id="memBar"><b id="memVal">--</b></span>
        <span class="h-donut" id="diskBar"><b id="diskVal">--</b></span>
      </div>
      <div class="uptime"><b id="uptimeText">--</b></div>
      <div id="sideResize"></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="mobileNavBtn" type="button" aria-label="菜单 / Menu" title="菜单 / Menu">
        <svg class="i"><use href="#i-menu"/></svg>
      </button>
      <div class="mobile-brand">
        <div class="logo" aria-hidden="true"><img src="/logo.svg" alt=""></div>
        ROS Center
      </div>
      <div class="crumbs"><span id="crumbGroup">总览</span><svg class="i"><use href="#i-chevron"/></svg><b id="crumbSection">仪表盘</b></div>

      <div class="topsearch-wrap">
        <label class="topsearch" for="navSearch">
          <svg class="i"><use href="#i-search"/></svg>
          <input id="navSearch" type="search" placeholder="搜索页面、设备或规则…" autocomplete="off" aria-label="全局搜索">
          <kbd id="searchKbd" title="Command + K / Ctrl + K"><span id="kbdMod">⌘</span>&nbsp;K</kbd>
        </label>
        <div class="search-pop" id="searchPop" hidden></div>
      </div>

      <div class="top-actions">
        <button class="dev-btn" id="devBtn" type="button" title="切换设备 / Switch device">
          <span class="dev-ico sm"><svg class="i"><use href="#i-device"/></svg></span>
          <b id="devBtnName">主路由</b>
          <span class="dev-sub" id="devBtnSub">RouterOS</span>
          <span class="dot" id="devBtnDot"></span>
          <svg class="i chev"><use href="#i-chev-down"/></svg>
        </button>
        <button class="icon-btn theme-btn" id="modeBtn" type="button" aria-label="外观设置" aria-haspopup="dialog" aria-expanded="false" title="外观设置">
          <svg class="i"><use href="#i-palette"/></svg>
        </button>
        <button class="icon-btn" id="bellBtn" type="button" title="通知 / Notifications" aria-label="Notifications">
          <svg class="i"><use href="#i-bell"/></svg><span class="badge-dot" id="bellDot" hidden></span>
        </button>
        <button class="avatar" id="avatarBtn" type="button" title="账户 / Account">B</button>
      </div>
    </header>

    <main class="content" id="content"></main>
    <div class="mobile-nav-menu" id="mobileNavMenu" hidden><div class="mnm-search"><input type="search" id="mnmSearch" placeholder="搜索菜单…" autocomplete="off"></div><div class="mnm-list" id="mnmList"></div></div>
  </div>
</div>

<div class="modal-mask" id="modalMask" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast-wrap" id="toastWrap"></div>
