<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="page_title">ROS Center</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="side-brand">
      <div class="logo" aria-hidden="true"><svg class="logo-svg" viewBox="0 0 64 64">
        <g stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".8"><path d="M32 32 L32 16"/><path d="M32 32 L16 43"/><path d="M32 32 L48 43"/></g>
        <g fill="currentColor"><circle cx="32" cy="14" r="5.5"/><circle cx="14" cy="44" r="5.5"/><circle cx="50" cy="44" r="5.5"/></g>
        <circle cx="32" cy="32" r="9.5" fill="currentColor"/><circle cx="32" cy="32" r="4.2" fill="var(--blue)"/>
      </svg></div>
      <div class="brand-name"><b data-i18n="brand">ROS</b><small data-i18n="brand_sub">Center</small><span class="brand-ver" id="brandVer" title="当前版本 / Current version"></span></div>
      <button class="side-collapse" id="collapseBtn" type="button" title="收起 / Collapse">‹</button>
    </div>
    <div class="side-search" id="sideSearch">
      <svg class="search-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="navSearch" type="search" data-i18n-ph="search_menu" placeholder="搜索菜单…" autocomplete="off">
      <span class="kbd-hint" id="searchKbd" title="Command + K / Ctrl + K"><kbd id="kbdMod">⌘</kbd><span class="kbd-plus">+</span><kbd>K</kbd></span>
    </div>
    <div class="nav-fold-bar"><span data-i18n="sidebar_hint">点击箭头折叠侧栏，拖动右侧边缘调整宽度</span><button id="foldAllBtn" type="button" title="收起/展开全部分组">−</button></div>
    <nav class="side-nav" id="sideNav"></nav>
    <div class="side-foot">
      <div class="side-status"><span class="dot" id="sideDot"></span><b id="sideStream" class="side-stream" hidden></b><span id="sideMode" class="side-mode" hidden></span></div>
      <div class="side-foot-actions">
        <button class="side-logout" id="settingsShortcut" type="button" title="连接设置 / Connection settings">⚙</button>
        <button class="side-logout" id="updateBadge" type="button" hidden title="发现新版本 / Update available" style="color:var(--blue)">↑</button>
        <button class="side-logout" id="exportBtn" type="button" title="获取配置快照 / Export snapshot" data-i18n-title="export_snapshot">⇩</button>
        <button class="side-logout" id="authLogoutBtn" type="button" title="退出登录 / Sign out" data-i18n-title="logout" hidden>⎋</button>
      </div>
    </div>
    <div class="side-resize" id="sideResize" title="拖动调整宽度 / Drag to resize"></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="top-left">
        <button class="menu-toggle" id="menuToggle" type="button" aria-label="菜单">☰</button>
        <div class="crumbs"><span id="crumbGroup">系统概览</span><span class="crumb-sep">/</span><b id="crumbSection">系统概览</b></div>
      </div>
      <div class="top-right">
        <div class="health" id="health">
          <div class="health-item"><span class="h-label" data-i18n="cpu">CPU</span><span class="h-value" id="cpuVal">--</span><span class="h-bar"><i id="cpuBar"></i></span></div>
          <div class="health-item"><span class="h-label" data-i18n="mem">内存</span><span class="h-value" id="memVal">--</span><span class="h-bar"><i id="memBar"></i></span></div>
          <div class="health-item"><span class="h-label" data-i18n="disk">存储</span><span class="h-value" id="diskVal">--</span><span class="h-bar"><i id="diskBar"></i></span></div>
        </div>
        <span class="top-sep"></span>
        <div class="uptime"><span data-i18n="uptime">运行</span> <b id="uptimeText">--</b></div>
        <span class="top-sep"></span>
        <label class="device-pick" title="切换设备 / Switch device">
          <span class="device-icon">▣</span>
          <select id="deviceSelect" aria-label="Device"></select>
          <span class="device-dot" id="deviceDot"></span>
        </label>
        <span class="top-sep"></span>
        <label class="theme-pick" title="界面风格 / Theme">
          <span class="palette-icon">◐</span>
          <select id="themeSelect" aria-label="Theme"></select>
        </label>
        <button class="mode-toggle" id="modeBtn" type="button" aria-label="Light / dark mode" title="浅色 / 深色 / 跟随系统">☀</button>
        <button class="motion-toggle" id="motionBtn" type="button" aria-label="动画效果 / Motion" title="动画效果 / Motion">✦</button>
        <button class="lang" id="langBtn" type="button"><span class="lang-globe"></span><span id="langLabel">EN</span></button>
        <label class="auto-refresh" id="autoRefresh" title="自动刷新 / Auto refresh">
          <span class="ar-icon" aria-hidden="true">⟳</span><span class="ar-label" data-i18n="auto_refresh">自动刷新</span>
          <input type="checkbox" id="autoRefreshChk" checked><span class="ar-track" aria-hidden="true"><i></i></span>
        </label>
        <div class="admin" id="adminBtn" title="连接设置 / Connection settings"><span class="avatar">B</span><span id="adminName">Backspace</span><span class="caret">▾</span></div>
      </div>
    </header>

    <div class="content" id="content"></div>
  </div>
</div>

<div class="modal-mask" id="modalMask" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast-wrap" id="toastWrap"></div>
<script src="/app.js"></script>
<script src="/views.js"></script>
<script src="/topology.js"></script>
<script src="/ipmonitor.js"></script>
<script src="/qrcode.bundle.js"></script>
<script src="/wgkey.js"></script>
<script src="/updates.js"></script>
<script src="/quicksetup.js"></script>
<script src="/resizable.js"></script>
<script src="/config.js"></script>
</body>
</html>
