<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROS Center · Sign in</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root{
    --bg:#f7f8fa; --card:#ffffff; --ink:#1d2129; --muted:#8a919c; --line:#e8eaed;
    --soft:#f7f8fa; --accent:#006fff; --accent-hover:#0059cc; --err:#e5484d;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 12px 32px rgba(16,24,40,.07);
  }
  html[data-scheme="dark"]{
    --bg:#111316; --card:#1b1e23; --ink:#eef0f3; --muted:#8b929c; --line:#2b2f36;
    --soft:#22262c; --accent:#4a90ff; --accent-hover:#3a7ce8;
    --shadow:0 1px 2px rgba(0,0,0,.2), 0 16px 40px rgba(0,0,0,.3);
  }
  /* 其它配色沿用各自强调色 */
  html[data-scheme="light"][data-theme="default"]{--accent:#2563eb;--accent-hover:#1d4ed8}
  html[data-scheme="light"][data-theme="ocean"]{--accent:#1f8fbf;--accent-hover:#16749c}
  html[data-scheme="light"][data-theme="aurora"]{--accent:#2ab8e0;--accent-hover:#1598bd}
  html[data-scheme="light"][data-theme="sakura"]{--accent:#d9668f;--accent-hover:#bd4f79}
  html[data-scheme="light"][data-theme="forest"]{--accent:#2f8f5b;--accent-hover:#247447}
  html[data-scheme="light"][data-theme="amber"]{--accent:#d9851c;--accent-hover:#b56a10}
  html[data-scheme="light"][data-theme="violet"]{--accent:#6d5ce0;--accent-hover:#5745c4}
  html[data-scheme="light"][data-theme="coffee"]{--accent:#a9773f;--accent-hover:#8b5e30}
  html[data-scheme="light"][data-theme="mint"]{--accent:#1f9e8f;--accent-hover:#167c71}
  html[data-scheme="light"][data-theme="mono"]{--accent:#3a3a3a;--accent-hover:#1f1f1f}
  html[data-scheme="light"][data-theme="porcelain"]{--accent:#1a4f9c;--accent-hover:#123c78}
  html[data-scheme="dark"][data-theme="sakura"]{--accent:#e88bb0;--accent-hover:#d4739b}
  html[data-scheme="dark"][data-theme="forest"]{--accent:#5fc98f;--accent-hover:#48ae77}
  html[data-scheme="dark"][data-theme="violet"]{--accent:#a794ff;--accent-hover:#8f79ee}
  html[data-scheme="dark"][data-theme="mono"]{--accent:#bdbdbd;--accent-hover:#d4d4d4}
  html[data-theme="porcelain"] body{background-color:var(--bg);
    background-image:radial-gradient(circle at 50% 50%,rgba(26,79,156,.09) 0 1px,transparent 1px 12px);background-size:104px 104px}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    font:13.5px/1.55 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
  .login{width:100%;max-width:384px;background:var(--card);border:1px solid var(--line);border-radius:10px;
    box-shadow:var(--shadow);padding:32px 30px 24px}
  .brand{display:flex;align-items:center;gap:11px;margin-bottom:28px}
  .logo{width:34px;height:34px;flex:none;border-radius:9px;overflow:hidden}
  .logo img{width:100%;height:100%;display:block}
  .brand b{display:block;font-size:16px;font-weight:800;letter-spacing:-.35px;line-height:1.15}
  .brand small{display:inline-block;margin-top:3px;padding:1px 6px;border-radius:999px;background:var(--soft);
    border:1px solid var(--line);color:var(--muted);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
  h1{margin:0 0 5px;font-size:21px;font-weight:600;letter-spacing:-.4px}
  .sub{margin:0 0 24px;color:var(--muted);font-size:12.5px}
  .hint{margin:-12px 0 20px;padding:8px 10px;border:1px solid color-mix(in srgb,var(--accent) 28%,var(--line));
    border-radius:6px;background:color-mix(in srgb,var(--accent) 7%,var(--card));color:var(--ink);font-size:11.5px;line-height:1.5}
  .hint code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:0 4px}
  label{display:block;font-size:12px;font-weight:500;margin:0 0 7px;color:var(--muted)}
  .field{position:relative;margin-bottom:16px}
  input{width:100%;height:40px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);
    padding:0 12px;font:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent)}
  input::placeholder{color:var(--muted)}
  input[type=password]{padding-right:62px}
  .eye{position:absolute;right:5px;top:5px;height:30px;padding:0 9px;border:0;border-radius:5px;background:transparent;
    color:var(--muted);cursor:pointer;font-size:11.5px}
  .eye:hover{background:var(--soft);color:var(--ink)}
  .btn{width:100%;height:40px;margin-top:8px;border:0;border-radius:6px;cursor:pointer;
    font:600 13.5px inherit;color:#fff;background:var(--accent);transition:background-color .15s}
  .btn:hover{background:var(--accent-hover)}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .err{min-height:18px;margin-top:12px;color:var(--err);font-size:12px;text-align:center}
  .foot{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;text-align:center}
  .foot a{color:var(--accent);text-decoration:none;cursor:pointer}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;
    border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes s{to{transform:rotate(360deg)}}
  @media (max-width:420px){.login{padding:26px 22px 20px}}
</style>
</head>
<body>
<div class="login">
  <div class="brand">
    <div class="logo" aria-hidden="true"><img src="/logo.svg" alt=""></div>
    <div><b>ROS Center</b><small>sign in</small></div>
  </div>
  <h1 id="title">登录 ROS Center</h1>
  <p class="sub" id="sub">请输入 WebUI 账号与密码</p>
  <p class="hint" id="hint" style="display:none"></p>
  <form id="form" autocomplete="on">
    <div class="field"><label for="user" id="lUser">账号</label><input id="user" name="username" autocomplete="username" required autofocus></div>
    <div class="field"><label for="pass" id="lPass">密码</label><input id="pass" name="password" type="password" autocomplete="current-password">
      <button class="eye" id="eye" type="button">显示</button></div>
    <button class="btn" id="go" type="submit">登 录</button>
    <div class="err" id="err"></div>
  </form>
  <form id="otpForm" style="display:none" autocomplete="off">
    <div class="field"><label for="otp" id="lOtp">两步验证码</label><input id="otp" name="otp" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="000000" required></div>
    <button class="btn" id="otpGo" type="submit">验 证 并 登 录</button>
    <button class="eye" id="otpBack" type="button" style="display:block;margin:10px auto 0">返回</button>
    <div class="err" id="otpErr"></div>
  </form>
  <div class="foot" id="foot">登录状态会保存在本浏览器的安全 Cookie 中</div>
</div>
<script>
(function(){
  var zh = (localStorage.getItem('ros-traffic-lang') || (navigator.language||'').slice(0,2)) !== 'en';
  var legacy = localStorage.getItem('ros-traffic-theme');
  var mode = localStorage.getItem('ros-mode') || (legacy === 'dark' ? 'dark' : legacy === 'light' ? 'light' : 'system');
  var saved = localStorage.getItem('ros-theme');
  var theme = (!saved || saved === 'unifi') ? 'default' : saved;
  var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  var scheme = mode === 'system' ? (prefersDark ? 'dark' : 'light') : mode;
  document.documentElement.dataset.theme = theme;
  document.documentElement.dataset.scheme = scheme;
  document.documentElement.dataset.themeDark = (scheme === 'dark' ? '1' : '0');
  var next = new URLSearchParams(location.search).get('next') || '/';
  if (!/^\/(?!\/)/.test(next)) next = '/';
  var $ = function(id){ return document.getElementById(id); };
  $('title').textContent = zh ? '登录 ROS Center' : 'Sign in to ROS Center';
  $('sub').textContent = zh ? '请输入 WebUI 账号与密码' : 'Enter your WebUI username and password';
  $('lUser').textContent = zh ? '账号' : 'Username';
  $('lPass').textContent = zh ? '密码' : 'Password';
  $('eye').textContent = zh ? '显示' : 'Show';
  $('go').textContent = zh ? '登 录' : 'Sign in';
  $('foot').textContent = zh ? '登录状态保存在本浏览器的安全 Cookie 中 · 7 天有效' : 'Session is kept in a secure HttpOnly cookie · valid for 7 days';
  $('lOtp').textContent = zh ? '两步验证码' : 'Verification code';
  $('otpGo').textContent = zh ? '验 证 并 登 录' : 'Verify & sign in';
  $('otpBack').textContent = zh ? '返回' : 'Back';
  $('sub').textContent = zh ? '请输入 WebUI 账号与密码' : 'Enter your WebUI username and password';

  fetch('/api/auth').then(function(r){ return r.json(); }).then(function(d){
    if (d && d.defaultPassword) {
      var h = $('hint');
      h.innerHTML = zh
        ? '当前为初始账户 <code>admin</code> / <code>admin</code>，登录后请立即新增管理员账户。'
        : 'Default account <code>admin</code> / <code>admin</code> — add a new administrator right after signing in.';
      h.style.display = '';
    }
    if (d && d.enabled === false) {
      /* auth 关闭时直接进主页；但要防止 next 指回登录页或异常反复跳转造成死循环 */
      if (/^\/login(\.html)?([?#]|$)/.test(next)) next = '/';
      /* 仅统计最近 8 秒内的往返次数；正常进入主页后计数自然失效 */
      var st = null;
      try { st = JSON.parse(sessionStorage.getItem('ros-login-redirect') || 'null'); } catch(e){}
      if (!st || Date.now() - (st.t || 0) > 8000) st = { t: Date.now(), n: 0 };
      if (st.n >= 2) {
        /* 已往返两次仍回到登录页，停下来让用户看到页面，而不是无限刷新 */
        try { sessionStorage.removeItem('ros-login-redirect'); } catch(e){}
        err.textContent = '服务暂时无法正常进入，请刷新重试 / Unable to enter, please refresh';
        return;
      }
      st.n += 1; st.t = Date.now();
      try { sessionStorage.setItem('ros-login-redirect', JSON.stringify(st)); } catch(e){}
      location.replace(next);
    }
  }).catch(function(){});

  $('eye').onclick = function(){
    var p = $('pass'); p.type = p.type === 'password' ? 'text' : 'password';
    $('eye').textContent = p.type === 'password' ? (zh?'显示':'Show') : (zh?'隐藏':'Hide');
  };
  $('form').onsubmit = function(e){
    e.preventDefault();
    var err = $('err'), go = $('go');
    err.textContent = '';
    go.disabled = true;
    go.innerHTML = '<span class="spin"></span>' + (zh ? '登录中…' : 'Signing in…');
    fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ user: $('user').value.trim(), password: $('pass').value }) })
      .then(function(r){ return r.json().then(function(d){ return { ok:r.ok, d:d }; }); })
      .then(function(x){
        if (x.d && x.d.need2fa) {
          window.__pending2fa = x.d.pending;
          $('form').style.display = 'none';
          $('otpForm').style.display = '';
          $('title').textContent = zh ? '两步验证' : 'Two-factor verification';
          $('sub').textContent = zh ? '请输入验证器应用中的 6 位验证码' : 'Enter the 6-digit code from your authenticator';
          $('otp').focus();
          return;
        }
        if (!x.ok || x.d.error) { err.textContent = x.d.error || (zh?'登录失败':'Login failed'); return; }
        location.replace(next);
      })
      .catch(function(){ err.textContent = zh ? '无法连接服务，请稍后重试' : 'Connection failed. Try again.'; })
      .finally(function(){
        go.disabled = false;
        go.textContent = zh ? '登 录' : 'Sign in';
      });
  };
  $('otpBack').onclick = function(){
    $('otpForm').style.display = 'none'; $('form').style.display = '';
    $('title').textContent = zh ? '登录 ROS Center' : 'Sign in to ROS Center';
    $('sub').textContent = zh ? '请输入 WebUI 账号与密码' : 'Enter your WebUI username and password';
    $('otpErr').textContent = ''; window.__pending2fa = null;
  };
  $('otpForm').onsubmit = function(e){
    e.preventDefault();
    var otpErr = $('otpErr'), otpGo = $('otpGo');
    otpErr.textContent = '';
    otpGo.disabled = true;
    otpGo.textContent = zh ? '验证中…' : 'Verifying…';
    fetch('/api/login/2fa', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ pending: window.__pending2fa || '', code: $('otp').value.trim() }) })
      .then(function(r){ return r.json().then(function(d){ return { ok:r.ok, d:d }; }); })
      .then(function(x){
        if (!x.ok || x.d.error) { otpErr.textContent = x.d.error || (zh?'验证失败':'Verification failed'); return; }
        location.replace(next);
      })
      .catch(function(){ otpErr.textContent = zh ? '无法连接服务，请稍后重试' : 'Connection failed. Try again.'; })
      .finally(function(){ otpGo.disabled = false; otpGo.textContent = zh ? '验 证 并 登 录' : 'Verify & sign in'; });
  };
})();
</script>
</body>
</html>
