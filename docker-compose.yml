services:
  ros-center:
    image: ${DOCKER_IMAGE:-backspacem/ros-center:latest}
    build: .
    container_name: ros-center
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-10086}:${CONTAINER_PORT:-10086}"
    volumes:
      - ./data:/app/data
    environment:
      PORT: ${CONTAINER_PORT:-10086}
      HOST: 0.0.0.0
      ROS_HOST: ${ROS_HOST:-192.168.88.1}
      ROS_PORT: ${ROS_PORT:-8728}
      ROS_USER: ${ROS_USER:-monitor}
      ROS_PASSWORD: ${ROS_PASSWORD:-}
      ROS_TLS: ${ROS_TLS:-0}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-1000}
      CONN_POLL_INTERVAL_MS: ${CONN_POLL_INTERVAL_MS:-5000}
      TRAFFIC_STREAM: ${TRAFFIC_STREAM:-1}
      TRAFFIC_STREAM_RETRY_MS: ${TRAFFIC_STREAM_RETRY_MS:-10000}
      HISTORY_POINTS: ${HISTORY_POINTS:-180}
      DEMO_MODE: ${DEMO_MODE:-0}
      ROS_CENTER_KEY: ${ROS_CENTER_KEY:-}
      WEB_USER: ${WEB_USER:-}
      WEB_PASSWORD: ${WEB_PASSWORD:-}
      ROS_UPDATE_ENABLED: ${ROS_UPDATE_ENABLED:-}
      ROS_UPDATE_SOURCE: ${ROS_UPDATE_SOURCE:-}
      ROS_UPDATE_PROXY: ${ROS_UPDATE_PROXY:-}
      ROS_UPDATE_ENDPOINT: ${ROS_UPDATE_ENDPOINT:-}
      ROS_UPDATE_IMAGE: ${ROS_UPDATE_IMAGE:-}
      ROS_UPDATE_INTERVAL: ${ROS_UPDATE_INTERVAL:-}
      ROS_CENTER_VERSION: ${ROS_CENTER_VERSION:-}
      ROS_CENTER_DIGEST: ${ROS_CENTER_DIGEST:-}
