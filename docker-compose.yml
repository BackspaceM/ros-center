services:
  ros-center:
    image: backspacem/ros-center:latest
    build: .
    container_name: ros-center
    restart: unless-stopped
    ports:
      - "10086:10086"
    volumes:
      - ./data:/app/data
    environment:
      PORT: 10086
      HOST: 0.0.0.0

# 首次启动打开 http://<宿主机IP>:10086，在「系统管理 → 设备管理」里添加 RouterOS。
# 连接参数、账号密码、主题、更新设置等都可在 WebUI 中修改，无需 .env 文件。
# 改端口：把 ports 与 PORT 一起改成如 8080:8080 / PORT: 8080。
# 想要网页内「一键更新并重建容器」：在 volumes 下加一行
#   - /var/run/docker.sock:/var/run/docker.sock
# 映射 docker.sock 等于把宿主机 Docker 控制权交给容器，非必要不要开启。
# ./data 保存全部设置与统计，请整体持久化。
