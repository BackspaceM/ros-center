services:
  ros-traffic:
    build: .
    image: ${DOCKER_IMAGE:-ros-traffic-webui:latest}
    container_name: ros-traffic
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:${CONTAINER_PORT:-3000}"
    volumes:
      - ./data:/app/data
    environment:
      PORT: ${CONTAINER_PORT:-3000}
      HOST: 0.0.0.0
      ROS_HOST: ${ROS_HOST:-192.168.88.1}
      ROS_PORT: ${ROS_PORT:-8728}
      ROS_USER: ${ROS_USER:-monitor}
      ROS_PASSWORD: ${ROS_PASSWORD:-}
      ROS_TLS: ${ROS_TLS:-0}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-2000}
      HISTORY_POINTS: ${HISTORY_POINTS:-180}
      DEMO_MODE: ${DEMO_MODE:-0}
      WEB_USER: ${WEB_USER:-}
      WEB_PASSWORD: ${WEB_PASSWORD:-}
